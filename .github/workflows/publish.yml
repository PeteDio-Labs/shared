name: Publish @petedio/shared

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Use public npm — Nexus is LAN-only and unreachable from GitHub runners
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Type check
        run: bun run typecheck

      - name: Publish to Nexus
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: |
          echo "registry=https://registry.toastedbytes.com/repository/npm-hosted/" > .npmrc
          echo "//registry.toastedbytes.com/repository/npm-hosted/:_auth=${NEXUS_NPM_TOKEN}" >> .npmrc
          npm publish --userconfig .npmrc
          rm .npmrc
