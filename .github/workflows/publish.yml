name: Publish @petedio/shared

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Publish to Nexus
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: |
          cat > .npmrc.publish << EOF
          registry=https://registry.toastedbytes.com/repository/npm-private/
          //registry.toastedbytes.com/repository/npm-private/:_auth=${NEXUS_NPM_TOKEN}
          EOF
          npm publish --userconfig .npmrc.publish
          rm .npmrc.publish
