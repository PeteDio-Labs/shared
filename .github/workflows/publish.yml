name: Publish @petedio/shared

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Use public npm for install — @petedio/shared has no internal deps, so no Nexus needed here
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Type check
        run: bun run typecheck

      - name: Publish to Nexus
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: |
          printf 'registry=https://registry.pdlab.dev/repository/npm-hosted/\n' > .npmrc
          printf '//registry.pdlab.dev/repository/npm-hosted/:_auth=%s\n' "${NEXUS_NPM_TOKEN}" >> .npmrc
          npm publish --userconfig .npmrc
          rm .npmrc
